# Deploy Sphinx.  This could be shorter, but we also do some extra
# stuff.
#
# License: CC-0.  This is the canonical location of this file, which
# you may want to link to anyway:
#   https://github.com/coderefinery/sphinx-lesson-template/blob/main/.github/workflows/sphinx.yml
#  https://raw.githubusercontent.com/coderefinery/sphinx-lesson-template/main/.github/workflows/sphinx.yml


name: sphinx
on: [push, pull_request, workflow_dispatch]

env:
  DEFAULT_BRANCH: "main"
  # If these SPHINXOPTS are enabled, then be strict about the
  # builds and fail on any warnings.
  #SPHINXOPTS: "-W --keep-going -T"
  MULTIBRANCH: true    # to enable, must be 'true' lowercase
  OUTPUT_BASENAME: ${{ github.repository_owner }}-${{ github.event.repository.name }}     # used for pdf, epub
  GENERATE_SINGLEHTML: true   # to enable, must be 'true' lowercase
  GENERATE_EPUB: true         # to enable, must be 'true' lowercase
  GENERATE_PDF: true          # to enable, must be 'true' lowercase


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      # https://github.com/marketplace/actions/setup-python
      # ^-- This gives info on matrix testing.
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # https://docs.github.com/en/actions/guides/building-and-testing-python#installing-dependencies
      # ^-- This gives info on installing dependencies with pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

        # Debug
      - name: Debugging information
        env:
          ref: ${{github.ref}}
          event_name: ${{github.event_name}}
          head_ref: ${{github.head_ref}}
          base_ref: ${{github.base_ref}}
        run: |
          echo "github.ref: ${ref}"
          echo "github.event_name: ${event_name}"
          echo "github.head_ref: ${head_ref}"
          echo "github.base_ref: ${base_ref}"
          echo "GENERATE_PDF: ${GENERATE_PDF}"
          echo "GENERATE_SINGLEHTML: ${GENERATE_SINGLEHTML}"
          set -x
          git rev-parse --abbrev-ref HEAD
          git branch
          git branch -a
          git remote -v
          python -V
          pip list --not-required
          pip list

      - name: Make target publish directory (_gh-pages)
        run:
          mkdir _gh-pages/

      # Build
      # Error highlighter
      - uses: ammaraskar/sphinx-problem-matcher@master

      # Main build (dirhtml)
      - name: Build Sphinx docs (dirhtml)
        # SPHINXOPTS used via environment variables
        run: |
          make dirhtml
          # This fixes broken copy button icons, as explained in
          #   https://github.com/coderefinery/sphinx-lesson/issues/50
          #   https://github.com/executablebooks/sphinx-copybutton/issues/110
          # This can be removed once these PRs are accepted (but the
          # fixes also need to propagate to other themes):
          #   https://github.com/sphinx-doc/sphinx/pull/8524
          #   https://github.com/readthedocs/sphinx_rtd_theme/pull/1025
          sed -i 's/url_root="#"/url_root=""/' _build/dirhtml/index.html || true
          rsync -a _build/dirhtml/ _gh-pages/

      # singlehtml if requested
      - name: Generate singlehtml
        if: ${{ env.GENERATE_SINGLEHTML == 'true' }}
        run: |
          make singlehtml
          mv _build/singlehtml/ _gh-pages/singlehtml/

      # epub if requested
      - name: Generate epub
        if: ${{ env.GENERATE_EPUB == 'true' }}
        run: |
          make epub
          mv _build/epub/*.epub _gh-pages/${OUTPUT_BASENAME}.epub

      # PDF if requested.  Disabled by default since it requires more
      # modules, chromium, and is overall much more fragile.
      - name: Generate PDF
        if: ${{ env.GENERATE_PDF == 'true' }}
        run: |
          #pip install https://github.com/rkdarst/sphinx_pyppeteer_builder/archive/refs/heads/main.zip
          pip install sphinx_pyppeteer_builder
          make SPHINXOPTS="-t pdf" pyppeteer
          mv _build/pyppeteer/*.pdf _gh-pages/${OUTPUT_BASENAME}.pdf

      # Use gh-pages-multibranch to multiplex different branches into
      # one deployment. See
      # https://github.com/coderefinery/gh-pages-multibranch
      - name: gh-pages multibranch
        uses: coderefinery/gh-pages-multibranch@main
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.MULTIBRANCH == 'true' }}
        with:
          directory: _gh-pages/
          default_branch: ${{ env.DEFAULT_BRANCH }}
          publish_branch: gh-pages

      # Add the .nojekyll file
      - name: nojekyll
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          touch _gh-pages/.nojekyll

      # Save artifact for the next step.
      - uses: actions/upload-artifact@v6
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          name: gh-pages-build
          path: _gh-pages/

  # Deploy in a separate job so that write permissions are restricted
  # to the minimum steps.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # This if can't use the env context - find better way later.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      actions: read        # read the artifact timestamp
      issues: write        # comment on pull requests
      pull-requests: write # comment on pull requests

    steps:
      - uses: actions/download-artifact@v6
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ( env.MULTIBRANCH == 'true' || github.ref == format('refs/heads/{0}', env.DEFAULT_BRANCH )) }}
        with:
          name: gh-pages-build
          path: _gh-pages/

      # As of 2023, we could publish to pages via a Deployment.  This
      # isn't done yet to give it time to stabilize (out of beta), and
      # also having a gh-pages branch to check out is rather
      # convenient.

      # Deploy
      # https://github.com/peaceiris/actions-gh-pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ( env.MULTIBRANCH == 'true' || github.ref == format('refs/heads/{0}', env.DEFAULT_BRANCH )) }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _gh-pages/
          force_orphan: true

      # The gh-pages multibranch build above publishes this branch to
      #   <site>/branch/<branch>/
      # (with '/' in the branch name replaced by '--').  Tell the pull
      # request about it, replacing any comment from an earlier build.
      # This only applies if a multibranch build actually happened,
      # which is the same condition as the multibranch step above.
      - name: Find pull request for this branch
        id: pr
        if: ${{ env.MULTIBRANCH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                             --head "$GITHUB_REF_NAME" --json number \
                             --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Gather preview link and artifact timestamp
        id: preview
        if: ${{ env.MULTIBRANCH == 'true' && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same URL as the one gh-pages-multibranch reports (this
          # repository has no CNAME).
          brdir="${GITHUB_REF_NAME//\//--}"
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/branch/${brdir}/" >> "$GITHUB_OUTPUT"
          # Timestamp of the build artifact we just deployed.
          artifact_timestamp=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                                   --jq '.artifacts[] | select(.name == "gh-pages-build") | .created_at')
          echo "artifact_timestamp=$artifact_timestamp" >> "$GITHUB_OUTPUT"

      # https://github.com/peter-evans/find-comment
      - name: Find earlier preview comment
        id: find-comment
        if: ${{ env.MULTIBRANCH == 'true' && steps.pr.outputs.number != '' }}
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- preview-link -->'

      - name: Delete earlier preview comment
        if: ${{ steps.find-comment.outputs.comment-id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${{ steps.find-comment.outputs.comment-id }}"

      # https://github.com/peter-evans/create-or-update-comment
      - name: Comment preview link on pull request
        if: ${{ env.MULTIBRANCH == 'true' && steps.pr.outputs.number != '' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          body: |
            <!-- preview-link -->
            :book: Preview of this branch: <${{ steps.preview.outputs.url }}>

            Built at ${{ steps.preview.outputs.artifact_timestamp }} (artifact timestamp).
